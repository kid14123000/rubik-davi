<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>2×2 魔方 · DAVI 训练看板</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232c38; --fg:#e6edf3; --dim:#8b949e;
    --acc:#4c9aff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --vio:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1440px;margin:0 auto;padding:18px 22px 40px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.3px}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .tag b{color:var(--fg);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 420px;gap:16px}
  @media(max-width:1080px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h2{font-size:12.5px;margin:0 0 10px;color:var(--dim);font-weight:600;
           letter-spacing:.6px;text-transform:uppercase}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .v{font-size:25px;font-weight:680;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11.5px;color:var(--dim);margin-top:2px}
  .kpi .s{font-size:11px;color:var(--dim);margin-top:5px}
  canvas{width:100%;display:block}
  .prog{height:6px;background:#0b0f14;border-radius:99px;overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#2f81f7,#58a6ff);width:0}
  /* cube */
  .cubewrap{display:flex;justify-content:center;padding:6px 0 2px}
  .net{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:330px;margin:0 auto}
  .face{display:grid;grid-template-columns:1fr 1fr;gap:3px;align-content:start}
  .face.blank{visibility:hidden}
  .cell{border-radius:5px;aspect-ratio:1/1;transition:background .18s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
  .steps{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mv{font:600 12px/1 ui-monospace,monospace;background:#0b0f14;border:1px solid var(--line);
      color:var(--dim);border-radius:6px;padding:5px 7px;min-width:30px;text-align:center}
  .mv.on{color:#0d1117;background:var(--acc);border-color:var(--acc)}
  .mv.now{color:#0d1117;background:var(--ok);border-color:var(--ok)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  button{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:7px;
         padding:6px 12px;font-size:12.5px;cursor:pointer}
  button:hover{border-color:#3d4855}
  button.pri{background:#1f6feb;border-color:#1f6feb}
  .mut{color:var(--dim);font-size:12px}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}
  .badge.ok{color:var(--ok);border-color:rgba(63,185,80,.4)}
  .badge.bad{color:var(--bad);border-color:rgba(248,81,73,.4)}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  table.mini td{padding:3px 0;color:var(--dim)}
  table.mini td:last-child{text-align:right;color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2×2 魔方 · DAVI 训练看板</h1>
    <span class="tag">run <b id="run">-</b></span>
    <span class="tag">device <b id="dev">-</b></span>
    <span class="tag">depth curriculum <b id="kmax">-</b></span>
    <span class="tag" id="state">连接中…</span>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="v" id="k_acc">–</div><div class="l">策略 top-1 准确率</div>
      <div class="s">预测“撤销最后一步”</div></div>
    <div class="kpi"><div class="v" id="k_mae">–</div><div class="l">价值 MAE（对真值）</div>
      <div class="s">单位：步</div></div>
    <div class="kpi"><div class="v" id="k_solved">–</div><div class="l">beam 解出率</div>
      <div class="s" id="k_solved_s">随机取 80 个状态</div></div>
    <div class="kpi"><div class="v" id="k_opt">–</div><div class="l">其中恰好最优</div>
      <div class="s" id="k_opt_s">最优率</div></div>
    <div class="kpi"><div class="v" id="k_iter">0</div><div class="l">迭代 / 样本</div>
      <div class="s" id="k_rate">–</div>
      <div class="prog"><i id="progbar"></i></div></div>
  </div>

  <div class="grid">
    <div>
      <div class="card" style="margin-bottom:16px">
        <h2>策略学习（自监督）</h2>
        <canvas id="c1" height="200"></canvas>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h2>Loss（价值 / 策略，对数轴）</h2>
        <canvas id="c2" height="200"></canvas>
      </div>
      <div class="card">
        <h2>价值一致性与求解质量</h2>
        <canvas id="c3" height="200"></canvas>
      </div>
    </div>

    <div class="card" style="align-self:start">
      <h2>当前权重解题演示</h2>
      <div class="cubewrap"><div class="net" id="net"></div></div>
      <div class="steps" id="steps"></div>
      <div class="row">
        <button class="pri" id="btnNew">换一个打乱</button>
        <button id="btnPlay">播放</button>
        <button id="btnPrev">上一步</button>
        <button id="btnNext">下一步</button>
      </div>
      <div class="row"><span class="mut" id="demoInfo">等待模型…</span></div>
      <div class="row"><span class="mut" id="demoSub"></span></div>
      <table class="mini" id="cfgTable"></table>
    </div>
  </div>
</div>

<script>
const COLORS = ['#f2f4f6','#e0403a','#35a35a','#f2c53d','#e8842c','#3563d6'];
const FACEORDER = ['U','L','F','R','B','D'];
// net layout: row1: _ U _ _ ; row2: L F R B ; row3: _ D _ _
const LAYOUT = [[null,'U',null,null],['L','F','R','B'],[null,'D',null,null]];

let status = null, demo = null, step = 0, playing = false, timer = null, lastDemoFetch = 0;

function buildFaces(){
  const net = document.getElementById('net');
  net.innerHTML = '';
  for (let r=0;r<3;r++){
    for (let c=0;c<4;c++){
      const name = LAYOUT[r][c];
      const d = document.createElement('div');
      d.className = 'face' + (name ? '' : ' blank');
      if (name){ d.dataset.face = name; for (let i=0;i<4;i++){ const s=document.createElement('div'); s.className='cell'; d.appendChild(s);} }
      net.appendChild(d);
    }
  }
}
function paintFaces(faces){ // faces: 6 x 2 x 2, order FACEORDER
  document.querySelectorAll('.face[data-face]').forEach(f=>{
    const idx = FACEORDER.indexOf(f.dataset.face);
    [...f.children].forEach((cell,i)=>{
      cell.style.background = COLORS[faces[idx][Math.floor(i/2)][i%2]];
    });
  });
}

/* ---------- charts ---------- */
function chart(cv, series, opts={}){
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth, h = cv.height;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.clearRect(0,0,w,h);
  const padL=46, padR=12, padT=28, padB=22;
  const xs = series.flatMap(s=>s.points.map(p=>p[0]));
  const ys = series.flatMap(s=>s.points.map(p=>p[1])).filter(v=>isFinite(v));
  if (!xs.length || !ys.length){ return; }
  let x0=Math.min(...xs), x1=Math.max(...xs);
  let y0 = opts.zero ? 0 : Math.min(...ys), y1 = Math.max(...ys);
  if (opts.log){
    y0 = Math.max(opts.logmin ?? 1e-3, Math.min(...ys.filter(v=>v>0)));
    y1 = Math.max(y1, y0*2);
  }
  if (y1-y0 < 1e-9) y1 = y0+1;
  const X = v => padL + (v-x0)/(x1-x0||1)*(w-padL-padR);
  const Y = v => {
    if (opts.log){ const l0=Math.log10(y0), l1=Math.log10(y1);
      return h-padB - (Math.log10(Math.max(v,y0))-l0)/(l1-l0)*(h-padT-padB); }
    return h-padB - (v-y0)/(y1-y0)*(h-padT-padB);
  };
  // grid + y labels
  g.font = '10px ui-monospace,monospace'; g.textBaseline='middle';
  const ng = 4;
  for (let i=0;i<=ng;i++){
    const val = opts.log ? Math.pow(10, Math.log10(y0) + i/ng*(Math.log10(y1)-Math.log10(y0)))
                         : y0 + i/ng*(y1-y0);
    const y = Y(val);
    g.strokeStyle = '#1d2530'; g.beginPath(); g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke();
    g.fillStyle = '#6e7681'; g.textAlign='right';
    g.fillText(opts.fmtY ? opts.fmtY(val) : val.toFixed(2), padL-7, y);
  }
  // x labels
  g.textAlign='center';
  [x0,(x0+x1)/2,x1].forEach(v=>{ g.fillStyle='#6e7681'; g.fillText(Math.round(v), X(v), h-9); });
  // series
  series.forEach(s=>{
    const pts = s.points.filter(p=>isFinite(p[1]));
    if (!pts.length) return;
    g.strokeStyle = s.color; g.lineWidth = s.width||1.7; g.beginPath();
    let started=false;
    pts.forEach(p=>{ const x=X(p[0]), y=Y(p[1]); started?g.lineTo(x,y):(g.moveTo(x,y),started=true); });
    g.stroke();
    if (s.dot){ g.fillStyle=s.color; pts.slice(-1).forEach(p=>{ g.beginPath(); g.arc(X(p[0]),Y(p[1]),3.2,0,7); g.fill(); }); }
  });
  // legend
  let lx = padL+2;
  series.forEach(s=>{
    g.fillStyle = s.color; g.fillRect(lx, 8, 9, 3);
    g.fillStyle = '#8b949e'; g.textAlign='left'; g.font='10.5px -apple-system,sans-serif';
    g.fillText(s.name, lx+13, 10);
    lx += 16 + g.measureText(s.name).width;
  });
}

/* ---------- data ---------- */
async function poll(){
  try{
    const r = await fetch('/api/status'); const st = await r.json(); status = st;
    if (st.waiting){ document.getElementById('state').textContent='等待训练写入…'; return; }
    const ev = (st.evals||[]).filter(e=>e.beam_solved!==undefined);
    const lastEv = ev.length? ev[ev.length-1] : null;
    const lastAll = (st.evals||[]).slice(-1)[0] || {};
    document.getElementById('run').textContent = st.run;
    document.getElementById('dev').textContent = st.device;
    document.getElementById('kmax').textContent = 'k ≤ ' + st.kmax_now;
    document.getElementById('state').innerHTML = st.done
      ? '<span class="badge ok">训练完成</span>'
      : '<span class="badge ok">训练中</span>';
    const pct = st.iters/st.total_iters;
    document.getElementById('k_iter').textContent = st.iters.toLocaleString();
    document.getElementById('k_rate').textContent =
      `${st.total_iters.toLocaleString()} 目标 · ${(st.iters/st.elapsed).toFixed(0)} it/s · ${fmtNum(st.samples)} 样本 · ${fmtDur(st.elapsed)}`;
    document.getElementById('progbar').style.width = (pct*100).toFixed(1)+'%';

    set('k_acc', st.p_acc_avg!=null ? (st.p_acc_avg*100).toFixed(1)+'%' : '–');
    set('k_mae', lastAll.v_mae!=null ? lastAll.v_mae.toFixed(2) : '–');
    set('k_solved', lastEv ? (lastEv.beam_solved*100).toFixed(0)+'%' : '–');
    set('k_solved_s', lastEv ? `beam ${lastEv.beam_width} · n=${lastEv.beam_n}` : '—');
    set('k_opt', lastEv ? (lastEv.beam_optimal*100).toFixed(0)+'%' : '–');
    set('k_opt_s', lastEv ? `平均 ${lastEv.beam_len.toFixed(1)} 步 / 最优 ${lastEv.opt_len.toFixed(1)}` : '—');

    const curve = st.curve||[];
    chart(document.getElementById('c1'), [
      {name:'策略 top-1 准确率', color:'#4c9aff', points: curve.map(c=>[c[0], c[3]]), dot:true},
      {name:'beam 解出率', color:'#3fb950',
       points: (st.evals||[]).filter(e=>e.beam_solved!==undefined).map(e=>[e.it, e.beam_solved])},
      {name:'greedy 解出率', color:'#8b949e',
       points: (st.evals||[]).map(e=>[e.it, e.greedy_solved])},
    ], {zero:true, fmtY:v=>(v*100).toFixed(0)+'%'});

    chart(document.getElementById('c2'), [
      {name:'loss_value', color:'#a371f7', points: curve.map(c=>[c[0], c[1]])},
      {name:'loss_policy', color:'#d29922', points: curve.map(c=>[c[0], c[2]])},
    ], {log:true, logmin:1e-3, fmtY:v=>v>=0.1?v.toFixed(1):v.toFixed(3)});

    chart(document.getElementById('c3'), [
      {name:'价值 MAE（步）', color:'#f85149', points:(st.evals||[]).map(e=>[e.it, e.v_mae]), dot:true},
      {name:'价值相关性', color:'#3fb950', points:(st.evals||[]).map(e=>[e.it, Math.max(e.v_corr,0)])},
      {name:'beam 冗余步数', color:'#8b949e', points:(st.evals||[]).filter(e=>e.beam_excess!==undefined).map(e=>[e.it, e.beam_excess])},
    ], {zero:true, fmtY:v=>v.toFixed(1)});

    const cfg = st.cfg||{};
    document.getElementById('cfgTable').innerHTML =
      `<tr><td>batch / hidden</td><td>${cfg.batch} / ${cfg.hidden}</td></tr>`+
      `<tr><td>参数量</td><td>${(st.params/1000).toFixed(0)}k</td></tr>`+
      `<tr><td>lr / γ</td><td>${cfg.lr} / ${cfg.gamma}</td></tr>`+
      `<tr><td>depth 课程</td><td>${cfg.kmax_start} → ${cfg.kmax}</td></tr>`+
      `<tr><td>beam</td><td>${cfg.beam_mode} · w=${cfg.beam_width}</td></tr>`;

    if (!demo || Date.now()-lastDemoFetch > 12000) fetchDemo(false);
  }catch(e){ document.getElementById('state').textContent = '连接断开'; }
}
function set(id,v){ const e=document.getElementById(id); if(e.textContent!==v) e.textContent=v; }
function fmtNum(n){ return n>=1e6? (n/1e6).toFixed(1)+'M' : n>=1e3? (n/1e3).toFixed(0)+'k' : n; }
function fmtDur(s){ const m=Math.floor(s/60); return m>0? `${m}m${String(Math.floor(s%60)).padStart(2,'0')}s` : `${s.toFixed(0)}s`; }

async function fetchDemo(force){
  lastDemoFetch = Date.now();
  const seed = force===true ? Math.floor(Math.random()*1e6) : (demo? demo.seed||0 : 0);
  const s = (force===true) ? Math.floor(Math.random()*1e6) : (window._seed ?? 0);
  if (force===true) window._seed = s;
  const r = await fetch(`/api/demo?seed=${window._seed ?? 0}&mode=policy&width=64`);
  const d = await r.json();
  if (d.waiting) return;
  d.seed = window._seed ?? 0;
  demo = d; step = 0; renderDemo();
}
function renderDemo(){
  if (!demo) return;
  paintFaces(demo.steps[step].faces);
  const st = demo.steps;
  document.getElementById('steps').innerHTML = st.map((s,i)=>
    `<span class="mv ${i<step?'on':''} ${i===step?'now':''}">${s.move||'打乱'}</span>`).join('');
  const ok = demo.solved ? `<span class="badge ok">已还原</span>` : `<span class="badge bad">未还原</span>`;
  document.getElementById('demoInfo').innerHTML =
    `${ok} 打乱 <b>${demo.optimal}</b> 步最优 · 智能体 <b>${demo.length}</b> 步 · 第 ${step}/${demo.length} 步`;
  document.getElementById('demoSub').textContent =
    `模型迭代 ${demo.model_it ?? '–'} · 打乱序列 ${demo.scramble.join(' ')}`;
}

/* ---------- controls ---------- */
document.getElementById('btnNew').onclick = ()=>{ playing=false; clearInterval(timer); fetchDemo(true); };
document.getElementById('btnNext').onclick = ()=>{ if(demo && step<demo.steps.length-1){ step++; renderDemo(); } };
document.getElementById('btnPrev').onclick = ()=>{ if(demo && step>0){ step--; renderDemo(); } };
document.getElementById('btnPlay').onclick = ()=>{
  if (playing){ playing=false; clearInterval(timer); document.getElementById('btnPlay').textContent='播放'; return; }
  playing=true; document.getElementById('btnPlay').textContent='暂停';
  timer = setInterval(()=>{
    if (!demo){ return; }
    if (step < demo.steps.length-1){ step++; renderDemo(); }
    else { playing=false; clearInterval(timer); document.getElementById('btnPlay').textContent='播放'; }
  }, 650);
};

buildFaces();
window._seed = 0;
poll(); setInterval(poll, 1200);
window.addEventListener('resize', ()=>{ if(status) poll(); });
</script>
</body>
</html>
